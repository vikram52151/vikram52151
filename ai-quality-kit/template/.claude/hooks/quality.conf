# quality.conf - optional settings for the AI quality kit hooks.
# This file is sourced by bash, so use plain VAR=value lines. Everything is commented out,
# which means the defaults shown are used. Claude is blocked from editing this file
# (it is under .claude/), so only a human can loosen these.

# ---- ai-gate.sh (Stop hook and manual gate) ----
# Replace auto-detection with one command (runs from the repo root):
# GATE_CMD="./mvnw -B -ntp verify && (cd frontend && npm run lint && npm run test:ci && npm run build)"

# Only look for builds in these directories (space-separated, relative to the repo root):
# GATE_PROJECT_DIRS="backend frontend"

# Consecutive times the Stop hook may block before Claude is allowed to stop anyway.
# 1 = the plain documented pattern (block once, then honour stop_hook_active).
# GATE_MAX_BLOCKS=3

# What to do about suspected test/gate tampering: warn (tell Claude and you) or block (fail the gate).
# GATE_TAMPER_MODE=warn

# Diff size above which the gate warns (lines added + deleted, lockfiles excluded).
# GATE_MAX_DIFF_LINES=400

# 0 = skip 'npm run build' in the local gate for speed (CI still runs it).
# GATE_RUN_BUILD=1

# Branch or ref to compare against (default: origin/HEAD, origin/main, origin/master, main, master).
# GATE_BASE_REF=origin/main

# 0 = also run the gate when only docs (*.md, docs/) changed.
# GATE_SKIP_DOCS_ONLY=1

# Lines of failing output fed back to Claude per failed step.
# GATE_LOG_TAIL=60

# ---- protect-files.sh (PreToolUse hook) ----
# Extra protected paths (shell globs, repo-relative, space-separated):
# PROTECT_EXTRA_GLOBS="src/main/resources/db/migration/* CLAUDE.md REVIEW.md"

# Paths to exempt from the built-in rules (checked first):
# PROTECT_ALLOW_GLOBS=".claude/plans/*"

# 1 = block every edit when jq and python3 are both missing (default: warn and allow).
# PROTECT_FAIL_CLOSED=0

# ---- post-edit-format.sh (PostToolUse hook) ----
# FORMAT_ON_EDIT=1
# LINT_ON_EDIT=1
